name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # ручной запуск: Actions → CI → Run workflow

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Манифесты и тесты логики плагинов
        run: npm test
