<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FPS / frame time meter</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #box { position: absolute; inset: 0; box-sizing: border-box; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px;
         font-family: system-ui, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  #head { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  #fps { font-size: 2.2em; font-weight: 700; line-height: 1; }
  #sub { opacity: .85; }
  #lines { line-height: 1.35; white-space: pre; }
  #graph { flex: 1 1 auto; min-height: 20px; width: 100%; display: block; }
  .ok { color: #5be37d; } .warn { color: #ffd24a; } .bad { color: #ff5c5c; }
</style>
</head>
<body>
<div id="box">
  <div id="head"><span id="fps">–</span><span id="sub">fps</span></div>
  <div id="lines"></div>
  <canvas id="graph"></canvas>
</div>
<script src="/plugin-sdk/oc.js"></script>
<script src="logic.js"></script>
<script>
(function () {
  "use strict";
  // Значения по умолчанию совпадают с plugin.json.
  var cfg = {
    target: oc.param("target", "auto"),
    windowSeconds: Math.min(30, Math.max(1, oc.param("windowSeconds", 5))),
    showLag: oc.param("showLag", true),
    showGraph: oc.param("showGraph", true),
    fontSize: Math.min(48, Math.max(8, oc.param("fontSize", 14))),
    textColor: oc.param("textColor", "#ffffff"),
    bgOpacity: Math.min(100, Math.max(0, oc.param("bgOpacity", 55)))
  };
  var targetFps = cfg.target === "auto" ? 0 : parseInt(cfg.target, 10) || 0;

  var box = document.getElementById("box"), fpsEl = document.getElementById("fps"),
      linesEl = document.getElementById("lines"), canvas = document.getElementById("graph");
  box.style.fontSize = cfg.fontSize + "px";
  box.style.color = cfg.textColor;
  box.style.background = "rgba(0,0,0," + (cfg.bgOpacity / 100) + ")";
  if (!cfg.showGraph) canvas.style.display = "none";

  var windowMs = cfg.windowSeconds * 1000;
  var frames = new FM.Frames(windowMs), lag = new FM.Lag(windowMs, 50);

  // Сам счётчик должен быть лёгким: время кадра пишем в rAF, а DOM и график обновляем реже.
  function onFrame(t) { frames.push(t); requestAnimationFrame(onFrame); }
  requestAnimationFrame(onFrame);
  setInterval(function () { lag.tick(performance.now()); }, 50);
  document.addEventListener("visibilitychange", function () { frames.resetGap(); lag.last = null; });

  var LEVELS = { ok: "ok", warn: "warn", bad: "bad" };
  function f1(x) { return x.toFixed(1); }

  function paintText(now, s) {
    if (s.n < 2) { fpsEl.textContent = "–"; fpsEl.className = ""; linesEl.textContent = "waiting for frames…"; return; }
    fpsEl.textContent = String(Math.round(s.fps));
    fpsEl.className = LEVELS[FM.level(s.avg, s.target)];
    var out = [
      "frame  avg " + f1(s.avg) + "  p95 " + f1(s.p95) + "  max " + f1(s.max) + " ms",
      "slow " + s.slow + "/" + s.n + "   missed " + s.missed + " (" + f1(s.droppedPct) + "%)   target " + s.target
    ];
    if (cfg.showLag) out.push("timer lag max " + f1(lag.max(now)) + " ms");
    linesEl.textContent = out.join("\n");
  }

  function paintGraph(now, s) {
    if (!cfg.showGraph) return;
    var dpr = window.devicePixelRatio || 1, w = Math.max(10, Math.floor(canvas.clientWidth * dpr)), h = Math.max(10, Math.floor(canvas.clientHeight * dpr));
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    var g = canvas.getContext("2d");
    g.clearRect(0, 0, w, h);
    var T = 1000 / s.target, top = T * 4; // шкала: до 4 целевых кадров
    var bins = frames.bins(now, Math.min(w, 400)), bw = w / bins.length, i;
    for (i = 0; i < bins.length; i++) {
      if (!bins[i]) continue;
      var lv = FM.level(bins[i], s.target);
      g.fillStyle = lv === "ok" ? "#5be37d" : lv === "warn" ? "#ffd24a" : "#ff5c5c";
      var bh = Math.max(1, Math.min(1, bins[i] / top) * h);
      g.fillRect(i * bw, h - bh, Math.max(1, bw - (bw > 3 ? 1 : 0)), bh);
    }
    // линия цели
    g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = Math.max(1, dpr);
    var y = h - (T / top) * h;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
  }

  setInterval(function () {
    var now = performance.now(), s = frames.snapshot(now, targetFps);
    paintText(now, s);
    if (s.n >= 2) paintGraph(now, s);
  }, 250);
})();
</script>
</body>
</html>
